u greendot - "GreenDotRDMA web service" /var/lib/greendotrdma -
g greendot-admin - -
# The Kubernetes CSI controller's SSH login. Its shell exists only so sshd can
# run the authorized_keys forced command (`greendotctl pipe`); membership in
# group `greendot` is what authorizes it at the daemon socket.
u greendot-csi - "GreenDotRDMA CSI controller (SSH forced command)" /var/lib/greendotrdma/csi /bin/sh
m greendot-csi greendot
