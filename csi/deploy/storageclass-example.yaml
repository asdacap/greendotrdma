# Every class names its own pool: datasetParent is the ZFS dataset volumes are
# created under (it must exist: `zfs create tank/csi`). One driver serves any
# number of pools — a second class with a different datasetParent is all it
# takes to split, say, a mirrored pool from a big stripe.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: greendot-rdma
provisioner: csi.greendot.io
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  datasetParent: "tank/csi"
  volblocksize: "16384"
  sparse: "true"
---
# Custom zvol name: pick the backing zvol's leaf under the class's
# datasetParent instead of the default pvc-<uuid>. Template it per PVC so
# names stay unique — a *literal* zvolName shared across PVCs would make two
# PVs silently share one zvol. (The ${...} tokens are expanded by the driver
# from the PVC/PV metadata the external-provisioner passes; the provisioner
# must run with --extra-create-metadata, as deploy/controller.yaml does.)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: greendot-rdma-named
provisioner: csi.greendot.io
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  datasetParent: "tank/csi"
  zvolName: "${pvc.namespace}-${pvc.name}"
  volblocksize: "16384"
  sparse: "true"
---
# Import a preexisting zvol: the driver exports it over NVMe-oF but NEVER
# destroys it — DeleteVolume tears down only the export. importDataset is the
# full zfs path; it may live anywhere, not just under a datasetParent. Also
# set reclaimPolicy: Retain (defence in depth) and note that imported volumes
# are not snapshottable or expandable in v1. One class imports one zvol; use a
# per-PVC value (e.g. an annotation, which needs --extra-create-metadata) to
# import different zvols from a single class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: greendot-rdma-import
provisioner: csi.greendot.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  importDataset: "tank/legacy/mydb"
---
# Thin LVM instead of ZFS: backend: lvm-thin provisions thin LVs in an existing
# thin pool (`vgcreate vg0 /dev/…` then
# `lvcreate --type thin-pool -L 500G -n pool0 vg0`). Volume ids are
# lvm1-<vg>:<lv>; snapshots are inactive thin snapshots in the same VG, and
# restoring one needs a class with the same volumeGroup and thinPool.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: greendot-rdma-thin
provisioner: csi.greendot.io
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  backend: "lvm-thin"
  volumeGroup: "vg0"
  thinPool: "pool0"
---
# Custom LV name, templated per PVC exactly like zvolName above.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: greendot-rdma-thin-named
provisioner: csi.greendot.io
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  backend: "lvm-thin"
  volumeGroup: "vg0"
  thinPool: "pool0"
  lvName: "${pvc.namespace}-${pvc.name}"
---
# Import a preexisting LV (thin or not) as <vg>/<lv>: exported, NEVER removed —
# DeleteVolume tears down only the export. Like importDataset, set
# reclaimPolicy: Retain; imported LVs are not snapshottable or expandable.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: greendot-rdma-thin-import
provisioner: csi.greendot.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  backend: "lvm-thin"
  importLv: "vg0/legacy-db"
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: greendot-snapshots
driver: csi.greendot.io
deletionPolicy: Delete
