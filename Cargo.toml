[workspace]
resolver = "3"
members = [
    "crates/greendot-proto",
    "crates/greendot-reconcile",
    "crates/greendotctl",
    "crates/greendot-web",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/asdacap/greendotrdma"

[workspace.dependencies]
greendot-proto = { path = "crates/greendot-proto" }
greendot-reconcile = { path = "crates/greendot-reconcile" }
anyhow = "1"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.30", features = ["socket", "user", "fs", "net"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rstest = "0.26"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tonic = "0.13"
prost = "0.13"
tonic-build = "0.13"

[profile.release]
lto = "thin"
strip = true
