syntax = "proto3";

// gRPC transport for the greendot-web (unprivileged) <-> greendotctl (root)
// helper protocol. These messages are a "dumb string" transport layer: unlike
// the validated newtypes in the domain model, prost decoding does NOT re-run
// the validators, so the daemon MUST convert every incoming request into its
// validated domain op (`TryFrom<pb::X> for ops::X`, src/ops.rs) before acting
// on it. Those conversions are the security choke point; the daemon's generic
// rpc middleware requires them by bound, so no method can skip them.
package greendot.helper.v1;

// Consumed by the Go CSI controller's stub generation (csi/Makefile);
// tonic-build ignores it.
option go_package = "github.com/asdacap/greendotrdma/csi/pkg/helperpb";

// The privileged helper: one rpc per operation. Reply shapes:
//
//   - `stream TaskEvent` — every mutation, plus the reads whose payload is a
//     foreign tool's output (SmartReport dumps smartctl, LvmReport streams
//     lvm's JSON, RdmaResources streams the rdma tool's JSON). Recorded as a
//     task: Started/Stdout/Stderr/Finished frames the web persists.
//   - typed replies — the structural reads: the daemon reads the canonical
//     system paths and answers with the shared actual-state DTO as a proto
//     message (no JSON-on-stdout round trip).
//   - `Ping`/`Authenticate` — one-shot, never recorded (a task records its
//     request, so recording Authenticate would write the password into the
//     task log).
//
// The daemon-side rule for adding ops: one rpc = one user-level intent. An op
// whose only caller would be a client-side sequence belongs in the daemon as
// part of an existing rpc (see PartitionShrink).
service Helper {
  // One-shot (never recorded).
  rpc Ping(Empty) returns (Empty);
  rpc Authenticate(.greendot.helper.v1.Authenticate) returns (AuthReply);

  // ZFS zvols and snapshots (reads happen unprivileged in greendot-web).
  rpc ZvolCreate(.greendot.helper.v1.ZvolCreate) returns (stream TaskEvent);
  rpc ZvolDelete(.greendot.helper.v1.ZvolDelete) returns (stream TaskEvent);
  rpc ZvolResize(.greendot.helper.v1.ZvolResize) returns (stream TaskEvent);
  rpc SnapshotCreate(.greendot.helper.v1.SnapshotCreate) returns (stream TaskEvent);
  rpc SnapshotDestroy(.greendot.helper.v1.SnapshotDestroy) returns (stream TaskEvent);

  // ZFS filesystem datasets (mount lifecycle).
  rpc ZfsFsCreate(.greendot.helper.v1.ZfsFsCreate) returns (stream TaskEvent);
  rpc ZfsSetMountpoint(.greendot.helper.v1.ZfsSetMountpoint) returns (stream TaskEvent);
  rpc ZfsMount(.greendot.helper.v1.ZfsMount) returns (stream TaskEvent);
  rpc ZfsUnmount(.greendot.helper.v1.ZfsUnmount) returns (stream TaskEvent);
  rpc ZfsDestroy(.greendot.helper.v1.ZfsDestroy) returns (stream TaskEvent);

  // ZFS pools.
  rpc PoolCreate(.greendot.helper.v1.PoolCreate) returns (stream TaskEvent);
  rpc PoolVdevAdd(.greendot.helper.v1.PoolVdevAdd) returns (stream TaskEvent);
  rpc PoolDeviceAttach(.greendot.helper.v1.PoolDeviceAttach) returns (stream TaskEvent);
  rpc PoolDeviceRemove(.greendot.helper.v1.PoolDeviceRemove) returns (stream TaskEvent);
  rpc PoolDeviceDetach(.greendot.helper.v1.PoolDeviceDetach) returns (stream TaskEvent);
  rpc PoolDeviceOnline(.greendot.helper.v1.PoolDeviceOnline) returns (stream TaskEvent);

  // Partitioning (sfdisk); PartitionShrink is the compound fs+partition op.
  rpc PartitionTableCreate(.greendot.helper.v1.PartitionTableCreate) returns (stream TaskEvent);
  rpc PartitionCreate(.greendot.helper.v1.PartitionCreate) returns (stream TaskEvent);
  rpc PartitionDelete(.greendot.helper.v1.PartitionDelete) returns (stream TaskEvent);
  rpc PartitionShrink(.greendot.helper.v1.PartitionShrink) returns (stream TaskEvent);

  // LVM.
  rpc LvmReport(.greendot.helper.v1.LvmReport) returns (stream TaskEvent);
  rpc VgCreate(.greendot.helper.v1.VgCreate) returns (stream TaskEvent);
  rpc VgExtend(.greendot.helper.v1.VgExtend) returns (stream TaskEvent);
  rpc VgReduce(.greendot.helper.v1.VgReduce) returns (stream TaskEvent);
  rpc VgRemove(.greendot.helper.v1.VgRemove) returns (stream TaskEvent);
  rpc LvCreate(.greendot.helper.v1.LvCreate) returns (stream TaskEvent);
  rpc ThinPoolCreate(.greendot.helper.v1.ThinPoolCreate) returns (stream TaskEvent);
  rpc ThinLvCreate(.greendot.helper.v1.ThinLvCreate) returns (stream TaskEvent);
  rpc LvResize(.greendot.helper.v1.LvResize) returns (stream TaskEvent);
  rpc LvShrink(.greendot.helper.v1.LvShrink) returns (stream TaskEvent);
  rpc LvRename(.greendot.helper.v1.LvRename) returns (stream TaskEvent);
  rpc LvDelete(.greendot.helper.v1.LvDelete) returns (stream TaskEvent);

  // Desired-state reconcile pass (the only apply path for NVMe-oF/iSCSI/NFS).
  rpc Reconcile(.greendot.helper.v1.Reconcile) returns (stream TaskEvent);

  // CSI exports: imperative, idempotent, and restricted by type to the CSI NQN
  // prefix — a sibling of (not nested under) the web prefix, so reconcile
  // treats CSI subsystems as foreign and the two owners never fight. They live
  // on a dedicated CSI port, never a render-managed one.
  rpc CsiNvmeApply(.greendot.helper.v1.CsiNvmeApply) returns (stream TaskEvent);
  rpc CsiNvmeDelete(.greendot.helper.v1.CsiNvmeDelete) returns (stream TaskEvent);
  rpc CsiHostGrant(.greendot.helper.v1.CsiHostGrant) returns (stream TaskEvent);
  rpc CsiHostRevoke(.greendot.helper.v1.CsiHostRevoke) returns (stream TaskEvent);
  rpc CsiVolumeExpand(.greendot.helper.v1.CsiVolumeExpand) returns (stream TaskEvent);
  rpc ZfsClone(.greendot.helper.v1.ZfsClone) returns (stream TaskEvent);

  // SSH keys authorized to open a `greendotctl pipe` session (the CSI
  // controller's login today). The daemon owns the forced command.
  rpc PipeKeyAdd(.greendot.helper.v1.PipeKeyAdd) returns (stream TaskEvent);
  rpc PipeKeyRevoke(.greendot.helper.v1.PipeKeyRevoke) returns (stream TaskEvent);

  // System setup.
  rpc RxeAdd(.greendot.helper.v1.RxeAdd) returns (stream TaskEvent);
  rpc EnableRoce(.greendot.helper.v1.EnableRoce) returns (stream TaskEvent);
  rpc SetMtu(.greendot.helper.v1.SetMtu) returns (stream TaskEvent);
  rpc InstallPackages(.greendot.helper.v1.InstallPackages) returns (stream TaskEvent);

  // Tool-output reads (streamed; the web collects stdout verbatim).
  rpc SmartReport(.greendot.helper.v1.SmartReport) returns (stream TaskEvent);
  rpc RdmaResources(Empty) returns (stream TaskEvent);

  // Structural reads: typed actual-state replies.
  rpc NfsReport(Empty) returns (NfsReportReply);
  rpc NvmetReport(Empty) returns (NvmetReportReply);
  rpc LioReport(Empty) returns (LioReportReply);
  rpc LioSessions(Empty) returns (LioSessionsReply);
  rpc RdmaDevices(Empty) returns (RdmaDevicesReply);
  rpc NicPciAddrs(Empty) returns (NicPciAddrsReply);
  rpc NicInterfaces(Empty) returns (NicInterfacesReply);
  rpc NicNetwork(Empty) returns (NicNetworkReply);
  rpc RoceCapableNics(Empty) returns (RoceCapableNicsReply);
  rpc NicRdmaAdvice(Empty) returns (NicRdmaAdviceReply);
  rpc SmartHealth(.greendot.helper.v1.SmartHealth) returns (SmartHealthReply);
  rpc ReconcileDryRun(Empty) returns (ReconcileDryRunReply);
  rpc ZvolInfo(.greendot.helper.v1.ZvolInfo) returns (ZvolInfoReply);
  rpc PipeAccessReport(Empty) returns (PipeAccessReportReply);
}

// Placeholder for unit request variants (Ping, NfsReport, ...). A oneof arm
// needs a message type; this carries no data.
message Empty {}

// ---- Enums (each mirrors a domain enum; the _UNSPECIFIED zero value is an
// invalid sentinel rejected on ingress). ----

enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  TRANSPORT_RDMA = 1;
  TRANSPORT_TCP = 2;
  TRANSPORT_LOOP = 3;
}

enum VdevLayout {
  VDEV_LAYOUT_UNSPECIFIED = 0;
  VDEV_LAYOUT_STRIPE = 1;
  VDEV_LAYOUT_MIRROR = 2;
  VDEV_LAYOUT_RAIDZ1 = 3;
  VDEV_LAYOUT_RAIDZ2 = 4;
  VDEV_LAYOUT_RAIDZ3 = 5;
}

enum VdevClass {
  VDEV_CLASS_UNSPECIFIED = 0;
  VDEV_CLASS_DATA = 1;
  VDEV_CLASS_SPECIAL = 2;
  VDEV_CLASS_LOG = 3;
  VDEV_CLASS_DEDUP = 4;
  VDEV_CLASS_CACHE = 5;
  VDEV_CLASS_SPARE = 6;
}

enum LvmReportKind {
  LVM_REPORT_KIND_UNSPECIFIED = 0;
  LVM_REPORT_KIND_VGS = 1;
  LVM_REPORT_KIND_LVS = 2;
  LVM_REPORT_KIND_PVS = 3;
}

enum ErrKind {
  ERR_KIND_UNSPECIFIED = 0;
  ERR_KIND_AUTH_FAILED = 1;
  ERR_KIND_NOT_IN_ADMIN_GROUP = 2;
  ERR_KIND_VALIDATION = 3;
  ERR_KIND_BUSY = 4;
  ERR_KIND_SYS = 5;
  ERR_KIND_CMD_FAILED = 6;
  ERR_KIND_UNSUPPORTED = 7;
}

enum SubStatus {
  SUB_STATUS_UNSPECIFIED = 0;
  SUB_STATUS_SUCCESS = 1;
  SUB_STATUS_FAILED = 2;
  SUB_STATUS_SKIPPED = 3;
}

// ---- Desired-state documents (nested payloads). ----

message NvmetDesired {
  repeated NvmetSubsysSpec subsystems = 1;
  repeated NvmetPortSpec ports = 2;
}
message NvmetSubsysSpec {
  string nqn = 1;
  bool allow_any_host = 2;
  repeated string allowed_hosts = 3;
  repeated NvmetNsSpec namespaces = 4;
}
message NvmetNsSpec {
  uint32 nsid = 1;
  string device_path = 2;
}
message NvmetPortSpec {
  uint32 id = 1;          // u16
  Transport trtype = 2;
  string traddr = 3;      // IpAddr
  uint32 trsvcid = 4;     // u16
  repeated string subsystems = 5;
}

message LioDesired {
  repeated LioBackstoreSpec backstores = 1;
  repeated LioTargetSpec targets = 2;
}
message LioBackstoreSpec {
  string name = 1;
  string device_path = 2;
}
message LioTargetSpec {
  string iqn = 1;
  bool enabled = 2;
  bool demo_mode = 3;
  repeated LioLunSpec luns = 4;
  repeated LioPortalSpec portals = 5;
  repeated string acls = 6;
}
message LioLunSpec {
  uint32 lun = 1;
  string backstore = 2;
}
message LioPortalSpec {
  string addr = 1;        // IpAddr
  uint32 port = 2;        // u16
  bool iser = 3;
}

message NfsDesired {
  repeated NfsExportSpec exports = 1;
  uint32 rdma_port = 2;   // u16
}
message NfsExportSpec {
  string path = 1;
  uint32 fsid = 2;
  repeated NfsClientSpec clients = 3;
}
message NfsClientSpec {
  string client = 1;
  bool rw = 2;
}

// ---- One-shot ops. ----

// PAM authentication plus the admin-group check, answered with `OkAuth` or an
// `AUTH_FAILED`/`NOT_IN_ADMIN_GROUP`/`BUSY` (rate-limited) error. It lives
// behind the root helper because greendot-web is unprivileged and only root can
// read `/etc/shadow`. Its own rpc (not a task stream) so the password never
// reaches a recorded task.
message Authenticate { string username = 1; string password = 2; }

message OkAuth { string username = 1; }
message ErrResponse { ErrKind kind = 1; string message = 2; }

message AuthReply {
  oneof result {
    OkAuth ok = 1;
    ErrResponse err = 2;
  }
}

// ---- Task-op request messages (one per rpc; also the domain op's wire twin). ----

message ZvolCreate {
  string dataset = 1;
  uint64 size = 2;
  optional uint32 volblocksize = 3;
  bool sparse = 4;
}
message ZvolDelete { string dataset = 1; }
message ZvolResize { string dataset = 1; uint64 new_size = 2; }
message SnapshotCreate { string dataset = 1; string snap = 2; }
message SnapshotDestroy { string dataset = 1; string snap = 2; }

message ZfsFsCreate { string dataset = 1; optional string mountpoint = 2; }
message ZfsSetMountpoint { string dataset = 1; string mountpoint = 2; }
message ZfsMount { string dataset = 1; }
message ZfsUnmount { string dataset = 1; }
message ZfsDestroy { string dataset = 1; bool recursive = 2; }

message PartitionTableCreate { string disk = 1; }
message PartitionCreate {
  string disk = 1;
  optional uint64 start_sector = 2;
  optional uint64 size_sectors = 3;
  string label = 4;
}
message PartitionDelete { string disk = 1; uint32 number = 2; }

// Shrink a partition *and its filesystem* as one operation (start sector
// preserved). The helper probes the filesystem itself, refuses mounted or
// unshrinkable filesystems, shrinks the filesystem first, then the partition —
// the whole sequence under one mutate lock, one subtask per step. How a given
// filesystem shrinks (ext* offline, btrfs via a helper-owned temp mount — it
// has no offline shrink) is the helper's business and never crosses this wire.
message PartitionShrink { string disk = 1; uint32 number = 2; uint64 size_sectors = 3; }

message PoolCreate {
  string name = 1;
  VdevLayout vdev = 2;
  repeated string devices = 3;
  optional uint32 ashift = 4;   // u8
}
// `zpool add <pool> [class] [layout] <dev>…` — one new top-level vdev. A data
// vdev emits no class keyword and a plain stripe no layout keyword; cache and
// spare take a plain device list (layout must be STRIPE — rejected on ingress).
message PoolVdevAdd {
  string pool = 1;
  VdevClass class = 2;
  VdevLayout layout = 3;
  repeated string devices = 4;
}
// `zpool attach <pool> <target> <device>` — grow an existing vdev. `target` is
// a leaf device path (mirror/single-disk) or a raidz vdev name (raidz
// expansion, OpenZFS 2.3+; on older zfs the task fails with zpool's error).
message PoolDeviceAttach { string pool = 1; string target = 2; string device = 3; }
// `zpool remove` as two subtasks: the remove itself, then `zpool wait -t
// remove` so the task only finishes when evacuation completes. `target` is a
// leaf device path or a top-level vdev name (`mirror-0`, `raidz1-0`, …).
message PoolDeviceRemove { string pool = 1; string target = 2; }
// `zpool detach <pool> <device>` — take a leaf device out of its mirror.
message PoolDeviceDetach { string pool = 1; string device = 2; }
// `zpool online <pool> <device>` — bring a REMOVED/OFFLINE leaf device back
// into service (kicks a resilver to catch up on writes made while it was gone).
message PoolDeviceOnline { string pool = 1; string device = 2; }

message SmartReport { string device = 1; }
message SmartHealth { repeated string devices = 1; }

message LvmReport { LvmReportKind what = 1; }
message VgCreate { string name = 1; repeated string devices = 2; }
message VgExtend { string vg = 1; string device = 2; }
message VgReduce { string vg = 1; string device = 2; }
message VgRemove { string vg = 1; }
message LvCreate { string vg = 1; string name = 2; uint64 size = 3; }
message ThinPoolCreate { string vg = 1; string name = 2; uint64 size = 3; }
message ThinLvCreate { string vg = 1; string pool = 2; string name = 3; uint64 virtual_size = 4; }
message LvResize { string vg = 1; string name = 2; uint64 new_size = 3; }
message LvShrink { string vg = 1; string name = 2; uint64 new_size = 3; }
message LvRename { string vg = 1; string name = 2; string new_name = 3; }
message LvDelete { string vg = 1; string name = 2; }

// Deliberately empty: the daemon reconciles against its own --config, so the
// peer cannot name a file for root to read.
message Reconcile { reserved 1; reserved "config"; }

// ---- CSI export ops. `nqn` fields are CsiNqn (prefix-checked on ingress). ----

// Idempotent upsert of one CSI export: subsystem with allow_any_host=0,
// namespace 1 with the pinned device_uuid (written before enable, so the
// initiator's /dev/disk/by-id path is deterministic and no read-back rpc is
// needed), the dedicated CSI port ensured, and the subsystem linked to it.
// Never touches allowed_hosts: grants survive re-apply.
message CsiNvmeApply {
  string nqn = 1;          // CsiNqn
  string device_path = 2;  // DevicePath
  string device_uuid = 3;  // NsUuid
  string traddr = 4;       // IpAddr
  uint32 trsvcid = 5;      // u16
  Transport transport = 6;
}
// Absent-tolerant teardown; also reaps the CSI port once its last link is gone
// (an empty port's id would otherwise be reclaimable by the web's renderer).
message CsiNvmeDelete { string nqn = 1; }
// Add one initiator NQN to the subsystem's allowed_hosts (the attach ACL).
message CsiHostGrant { string nqn = 1; string hostnqn = 2; }
// The fence, three steps in strict order: drop the host from allowed_hosts
// (closes the door — connect is rejected with DNR so the initiator gives up),
// unlink the subsystem from the CSI port (severs live controllers), relink.
// The ACL edit precedes the relink so the fenced host cannot slip back in.
message CsiHostRevoke { string nqn = 1; string hostnqn = 2; }
// Target-side volume expansion as one intent: resize the zvol backing
// namespace 1 (the dataset is derived from the subsystem's own device_path —
// the CsiNqn scopes what can be resized), then revalidate the namespace size.
message CsiVolumeExpand { string nqn = 1; uint64 new_size = 2; }

// Authorize one OpenSSH public key to run the pipe forced command. The request
// carries the key and nothing else: the `command="…",restrict` options are
// synthesized by the daemon from its own executable path, so a compromised web
// cannot turn a pipe grant into a shell. The key is re-parsed and canonically
// re-serialized on ingress (SshPublicKeyLine), so a paste can never smuggle a
// second authorized_keys line.
message PipeKeyAdd { string public_key = 1; }  // SshPublicKeyLine
// Remove the key with this SHA256 fingerprint — including a line this UI never
// wrote, so an admin's manually installed shell key can be revoked here too.
message PipeKeyRevoke { string fingerprint = 1; }  // SshFingerprint

// Everything the SSH-access diagnostic needs. Best-effort: a field that could
// not be read is false/empty, and the web renders that as a failed criterion.
message PipeAccessReportReply {
  string user = 1;                  // the packaged SSH user, e.g. greendot-csi
  bool user_exists = 2;
  // Membership of the daemon-socket group. Without it sshd lets the key in and
  // the helper socket then rejects it — the failure the diagnostic exists for.
  bool in_socket_group = 3;
  string socket_group = 4;
  // sshd's StrictModes rule, applied to each path it walks: owned by root or
  // the user, and not writable by group or other. A home directory owned by
  // the wrong user makes sshd refuse the key without saying so.
  bool home_ok = 5;
  string home_detail = 6;
  bool ssh_dir_ok = 7;
  string ssh_dir_detail = 8;
  bool authorized_keys_ok = 14;     // absent is fine: no key authorized yet
  string authorized_keys_detail = 15;
  string forced_command = 9;        // the exact options prefix the daemon writes
  bool forced_command_bin_ok = 10;  // that binary exists and is executable
  repeated PipeKeyEntry keys = 11;
  repeated HostKey host_keys = 12;
  // Key lines we could not parse. They are preserved untouched — and counted,
  // because an entry we cannot read is one whose options we cannot vouch for.
  uint32 unparsable_lines = 13;
}
message PipeKeyEntry {
  string fingerprint = 1;
  string algorithm = 2;
  string comment = 3;         // the key's label
  // False for a line this UI did not write: its options are absent (a full
  // shell) or not ours. Such lines are preserved verbatim, never rewritten.
  bool forced_command_ok = 4;
  string options = 5;         // the raw options prefix, for display
}
// One of the box's own SSH host keys, so an admin can pin known_hosts from the
// page instead of trusting an ssh-keyscan on first contact.
message HostKey {
  string algorithm = 1;
  string fingerprint = 2;  // SHA256:…
  string key_line = 3;     // "<algorithm> <base64>", the web prepends the host
}

// `zfs clone <dataset>@<snap> <target>`, optionally followed by a volsize bump
// (a clone inherits the origin's volsize; creating a bigger volume from a
// snapshot is one intent, so the resize rides along server-side).
message ZfsClone {
  string dataset = 1;      // DatasetName (the snapshot's dataset)
  string snap = 2;         // SnapName
  string target = 3;       // DatasetName
  optional uint64 new_size = 4;
}

// Structural read: does the zvol exist, and how big is it? (CSI CreateVolume
// idempotency and expand no-op detection.)
message ZvolInfo { string dataset = 1; }
message ZvolInfoReply { bool exists = 1; uint64 size_bytes = 2; }

// Enable Soft-RoCE on `netdev` as one task: load the rxe kernel module
// (skipped if already loaded), then add the rdma link.
message RxeAdd { string netdev = 1; }
message EnableRoce { string netdev = 1; }
message SetMtu { string netdev = 1; uint32 mtu = 2; }
message InstallPackages { repeated string packages = 1; }

// ---- Typed read replies. Each mirrors a shared `actual::*` DTO; addresses
// travel as strings (parsed on ingress, unparseable entries dropped). ----

message NfsReportReply {
  repeated NfsExportEntryMsg exports = 1;
  optional uint32 rdma_port = 2;   // u16
  repeated NfsManagedSpec managed = 3;
}
message NfsExportEntryMsg { string path = 1; repeated string clients = 2; }
message NfsManagedSpec { string path = 1; string client = 2; bool rw = 3; }

message NvmetReportReply {
  repeated ActualNvmetSubsys subsystems = 1;
  repeated ActualNvmetPort ports = 2;
}
message ActualNvmetSubsys {
  string nqn = 1;
  bool allow_any_host = 2;
  repeated string allowed_hosts = 3;
  repeated ActualNvmetNs namespaces = 4;
}
message ActualNvmetNs { uint32 nsid = 1; string device_path = 2; bool enabled = 3; }
message ActualNvmetPort {
  uint32 id = 1;          // u16
  string trtype = 2;
  string traddr = 3;
  string trsvcid = 4;
  repeated string subsystems = 5;
}

message LioReportReply {
  repeated ActualLioBackstore backstores = 1;
  repeated ActualLioTarget targets = 2;
}
message ActualLioBackstore { string name = 1; string udev_path = 2; bool enabled = 3; }
message ActualLioTarget {
  string iqn = 1;
  bool enabled = 2;
  bool demo_mode = 3;
  repeated string luns = 4;
  repeated ActualLioPortal portals = 5;
  repeated string acls = 6;
}
message ActualLioPortal { string addr_port = 1; bool iser = 2; }

message LioSessionsReply { repeated IscsiSessionMsg sessions = 1; }
message IscsiSessionMsg { string target_iqn = 1; string initiator_iqn = 2; string detail = 3; }

message RdmaDevicesReply { repeated RdmaDevMsg devices = 1; }
message RdmaDevMsg {
  string name = 1;
  optional string netdev = 2;
  bool active = 3;
  repeated string addrs = 4;   // IpAddr
}

message NicPciAddrsReply { repeated PciAddrIps entries = 1; }
message PciAddrIps { string pci = 1; repeated string addrs = 2; }   // IpAddr

message NicInterfacesReply { repeated NicStatusMsg nics = 1; }
message NicStatusMsg {
  string netdev = 1;
  optional string rdma = 2;
  optional string pci = 3;     // PciAddress
  repeated string addrs = 4;   // IpAddr
  NicRdmaKind kind = 5;
  // The helper-reported vendor label; set iff kind == CAPABLE_DISABLED.
  optional string vendor = 6;
}
enum NicRdmaKind {
  NIC_RDMA_KIND_UNSPECIFIED = 0;
  NIC_RDMA_KIND_ACTIVE = 1;
  NIC_RDMA_KIND_INACTIVE = 2;
  NIC_RDMA_KIND_CAPABLE_DISABLED = 3;
  NIC_RDMA_KIND_SOFT_ROCEABLE = 4;
  NIC_RDMA_KIND_UNSUPPORTED = 5;
}

message NicNetworkReply { repeated NicNetworkMsg nics = 1; }
message NicNetworkMsg {
  string netdev = 1;
  optional string mac = 2;
  optional uint32 mtu = 3;
  string operstate = 4;
  bool dhcp = 5;
  repeated NicAddrMsg addrs = 6;
  optional string gateway = 7;
}
message NicAddrMsg {
  string addr = 1;      // IpAddr
  uint32 prefix = 2;    // prefix length
  bool dynamic = 3;     // DHCP-assigned
}

message RoceCapableNicsReply { repeated RoceCapableNic nics = 1; }
message RoceCapableNic { string netdev = 1; string vendor = 2; }

message NicRdmaAdviceReply { repeated NicAdviceMsg advice = 1; }
message NicAdviceMsg { string netdev = 1; string label = 2; string detail = 3; }

message SmartHealthReply { repeated SmartHealthMsg devices = 1; }
message SmartHealthMsg { string device = 1; optional bool passed = 2; optional int32 temp_c = 3; }

message ReconcileDryRunReply { bool nvmet_ok = 1; bool lio_ok = 2; bool nfs_ok = 3; bool nic_ok = 4; }

// ---- Task streaming (the task-op reply). A task is a sequence of subtasks,
// each with its own recorded output and terminal status; Stdout/Stderr belong
// to the most-recent still-open subtask. Terminated by exactly one Finished. ----

message SubtaskStarted {
  string name = 1;
  optional string command = 2;
  repeated string args = 3;
  optional string stdin = 4;
}
message Output { string data = 1; }
message SubtaskFinished {
  SubStatus status = 1;
  int32 exit = 2;
  optional string error = 3;
}
message Finished {
  SubStatus status = 1;
  optional string error = 2;
}

message TaskEvent {
  oneof event {
    SubtaskStarted subtask_started = 1;
    Output stdout = 2;
    Output stderr = 3;
    SubtaskFinished subtask_finished = 4;
    Finished finished = 5;
  }
}
