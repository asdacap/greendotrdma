# The driver object: attachRequired makes Kubernetes call
# ControllerPublish/UnpublishVolume — the attach IS the allowed_hosts grant,
# and the detach IS the fence, so this must never be false.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.greendot.io
spec:
  attachRequired: true
  podInfoOnMount: false
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent
